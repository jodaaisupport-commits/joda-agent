<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joda Agent</title><style>
:root{color-scheme:dark;--bg:#080b12;--panel:#101624;--line:#24324a;--text:#e8eefb;--muted:#92a1bb;--accent:#71e5b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#162445,var(--bg) 45%);font-family:Inter,system-ui,sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0;font-size:1.5rem}.badge{color:#062519;background:var(--accent);padding:5px 10px;border-radius:20px;font-weight:700;font-size:.8rem}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{background:#101624dd;border:1px solid var(--line);border-radius:16px;padding:16px}#messages{height:430px;overflow:auto;display:flex;flex-direction:column;gap:12px}.message{white-space:pre-wrap;padding:11px 13px;border-radius:12px;max-width:85%}.user{align-self:flex-end;background:#23385a}.assistant{background:#172033}form{display:flex;gap:8px;margin-top:12px}input,button{border-radius:10px;padding:11px;border:1px solid var(--line);font:inherit}input{background:#0b101b;color:var(--text);width:100%}button{background:var(--accent);color:#062519;font-weight:700;cursor:pointer}.row{display:flex;gap:7px;margin:8px 0}.row button{padding:7px 10px}.muted{color:var(--muted);font-size:.9rem}@media(max-width:760px){.grid{grid-template-columns:1fr}#messages{height:330px}}</style></head>
<body><main><header><div><h1>✦ Joda Agent</h1><div class="muted">Private, safe-by-default assistant workspace</div></div><span id="mode" class="badge">OFFLINE MODE</span></header><div class="grid"><section class="card"><div id="messages"><div class="message assistant">Hello — I am ready in offline mode. I can calculate, tell the UTC time, and use your saved notes as context.</div></div><form id="chat"><input id="prompt" placeholder="Ask something, or type: calculate 7 * (8 + 2)" required><button>Send</button></form></section><aside><section class="card"><b>Memory</b><div class="muted">Saved notes are included in future chats.</div><form id="memory"><input id="memoryText" placeholder="Add a note" required><button>Save</button></form><div id="memories"></div></section><section class="card"><b>Reminders</b><div class="muted">Safe in-process reminders only.</div><form id="task"><input id="taskTitle" placeholder="Reminder title" required><input id="taskTime" type="datetime-local" required><button>Add</button></form><div id="tasks"></div></section></aside></div></main><script>
let conversationId;const $=id=>document.getElementById(id);const api=(url,opts={})=>fetch(url,{headers:{'content-type':'application/json'},...opts});function add(text,role){const e=document.createElement('div');e.className='message '+role;e.textContent=text;$('messages').append(e);$('messages').scrollTop=99999}async function refresh(){const m=await(api('/api/memories')).then(r=>r.json());$('memories').innerHTML=m.map(x=>`<div class="row"><span>${escapeHtml(x.content)}</span><button onclick="delMem(${x.id})">×</button></div>`).join('');const t=await(api('/api/tasks')).then(r=>r.json());$('tasks').innerHTML=t.map(x=>`<div class="row"><span>${escapeHtml(x.title)} <small>${new Date(x.run_at).toLocaleString()}</small></span><button onclick="delTask(${x.id})">×</button></div>`).join('')}function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}window.delMem=id=>api('/api/memories/'+id,{method:'DELETE'}).then(refresh);window.delTask=id=>api('/api/tasks/'+id,{method:'DELETE'}).then(refresh);$('chat').onsubmit=async e=>{e.preventDefault();const message=$('prompt').value.trim();if(!message)return;add(message,'user');$('prompt').value='';const r=await api('/api/chat',{method:'POST',body:JSON.stringify({conversationId,message})});const x=await r.json();conversationId=x.conversationId;add(x.response||x.error,'assistant')};$('memory').onsubmit=async e=>{e.preventDefault();await api('/api/memories',{method:'POST',body:JSON.stringify({content:$('memoryText').value})});$('memoryText').value='';refresh()};$('task').onsubmit=async e=>{e.preventDefault();const runAt=new Date($('taskTime').value).toISOString();await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('taskTitle').value,runAt})});$('taskTitle').value='';refresh()};api('/api/health').then(r=>r.json()).then(x=>{$('mode').textContent=x.mode==='mock'?'OFFLINE MODE':'REMOTE LLM'});refresh();</script></body></html>
